name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-functions:
    name: Type-check Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check supabase/functions/*/index.ts
      - name: Lint
        run: deno lint supabase/functions

  frontend:
    name: Syntax-check frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check application scripts
        run: |
          node --check js/app.js
          node --check js/auth-config.js
          node --check sw.js
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('deno.json','utf8'))"
